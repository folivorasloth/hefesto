[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engenheiro"
version = "0.1.0"
description = "Assistente de engenharia (mecânica, elétrica automotiva, ESP32) com RAG verificável"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "sqlite-vec>=0.1.6",
    "lingua-language-detector>=2.0",
    "pint>=0.24",
]

[project.optional-dependencies]
# Separado porque puxa torch e modelos grandes: a máquina que só consulta
# um índice pronto não precisa disso.
ingestao = ["docling>=2.60", "pypdfium2"]
reranker = ["sentence-transformers>=3"]
dev = ["pytest>=8", "reportlab>=4"]
voz = ["faster-whisper>=1.0", "piper-tts>=1.3", "sounddevice>=0.4", "webrtcvad-wheels>=2.0", "openwakeword>=0.4", "numpy", "scipy"]

[project.scripts]
engenheiro = "engenheiro.interfaces.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
engenheiro = ["store/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Os testes lentos ficam fora por padrão: rode com `pytest -m docling`.
addopts = '-m "not docling and not reranker and not voz"'
markers = [
    "docling: roda o Docling de verdade (lento, baixa modelos na primeira vez)",
    "reranker: baixa e roda o bge-reranker-v2-m3 (lento)",
    "voz: Piper + Whisper de verdade (precisa da voz baixada)",
]
