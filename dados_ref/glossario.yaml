  - pt: [rotação, rpm, giro]
    en: [engine speed, rpm, revolutions]
    colecoes: [ignicao, aquisicao_dados, mecanica_motor]

  # --- elétrica automotiva
  - pt: [bateria]
    en: [battery]
    colecoes: [eletrica_automotiva, veiculo]
  - pt: [alternador]
    en: [alternator]
    colecoes: [eletrica_automotiva, veiculo]
  - pt: [motor de partida, arranque]
    en: [starter motor, starter]
