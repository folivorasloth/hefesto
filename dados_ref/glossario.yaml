# Glossário técnico PT <-> EN usado na reescrita de consultas e no roteamento.
#
# É determinístico de propósito: a expansão da pergunta fica auditável no
# rastro e não depende de o LLM estar ligado ou acertar a tradução.
# Edite à vontade. Cada entrada:
#   pt:       formas em português (a primeira é a principal)
#   en:       equivalentes em inglês
#   colecoes: coleções onde esse assunto costuma estar (usado no roteamento)
#
# A comparação ignora acentos e maiúsculas, e casa palavras inteiras.

termos:
  # --- carburação / combustível
  - pt: [carburador]
    en: [carburetor, carburettor]
    colecoes: [carburacao_etanol, veiculo]
  - pt: [giclê, gicle, giclê principal]
    en: [jet, main jet]
    colecoes: [carburacao_etanol]
  - pt: [afogador, borboleta do afogador]
    en: [choke, choke valve]
    colecoes: [carburacao_etanol]
  - pt: [boia, bóia, nível da cuba, cuba]
    en: [float, float level, float bowl]
    colecoes: [carburacao_etanol]
  - pt: [marcha lenta]
    en: [idle, idle speed]
    colecoes: [carburacao_etanol, veiculo, mecanica_motor]
  - pt: [mistura, relação ar-combustível, relação ar combustível]
    en: [mixture, air-fuel ratio, AFR]
    colecoes: [carburacao_etanol, sensores]
  - pt: [estequiométrica, estequiometria]
    en: [stoichiometric, stoichiometry]
    colecoes: [carburacao_etanol]
  - pt: [etanol, álcool, alcool]
    en: [ethanol, alcohol]
    colecoes: [carburacao_etanol]
  - pt: [partida a frio, sistema de partida a frio, tanquinho]
    en: [cold start, cold start system]
    colecoes: [carburacao_etanol, veiculo]
  - pt: [bomba de combustível, bomba de gasolina]
    en: [fuel pump]
    colecoes: [veiculo, carburacao_etanol]
  - pt: [sonda lambda, sensor de oxigênio, lambda]
    en: [lambda sensor, oxygen sensor, O2 sensor, wideband]
    colecoes: [sensores, aquisicao_dados]

  # --- ignição
  - pt: [ignição]
