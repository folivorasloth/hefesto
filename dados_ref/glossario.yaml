    colecoes: [ignicao, veiculo]
  - pt: [bobina, bobina de ignição]
    en: [ignition coil, coil]
    colecoes: [ignicao, veiculo]
  - pt: [distribuidor]
    en: [distributor]
    colecoes: [ignicao, veiculo]
  - pt: [sensor hall, efeito hall]
    en: [hall sensor, hall effect]
    colecoes: [ignicao, sensores]
  - pt: [ponto de ignição, avanço, avanço de ignição]
